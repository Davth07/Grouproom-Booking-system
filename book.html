<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grupprumsbokning</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav>
            <a href="index.html">Hem</a>
            <a href="rooms.html">Rum</a>
            <a href="book.html">Boka</a>
            <a href="bookings.html">Bokningar</a>
            <a href="contact.html">Kontakta oss</a>
        </nav>
    </header>
    <main>
        <section>
            <h1>Boka Grupprum</h1>
            <form>
                <fieldset>
                    <legend>Personlig information</legend>
                    <label for="namn">Namn och efternamn:</label><br>
                    <input type="text" id="namn" name="namn" required><br><br>

                    <label for="email">E-post:</label><br>
                    <input type="email" id="email" name="email" required><br><br>
                </fieldset>
                <fieldset>
                    <legend>Bokningsinformation</legend>
                    <label for="rum">Välj grupprum:</label><br>
                    <select id="rum" name="rum" required>
                        <option hidden value="">--Välj Grupprum--</option>
                        <option value="grupprum103">Grupprum 103</option>
                        <option value="grupprum104">Grupprum 104</option>
                        <option value="grupprum202">Grupprum 202</option>
                    </select><br><br>

                    <label for="datum">Datum:</label><br>
                    <input type="date" id="datum" name="datum" required><br><br>

                    <label for="starttid">Starttid:</label><br>
                    <input type="time" id="starttid" name="starttid" required><br><br>

                    <label for="sluttid">Sluttid:</label><br>
                    <input type="time" id="sluttid" name="sluttid" required><br><br>
                </fieldset>
                <fieldset>
                    <legend>Ytterligare information</legend>
                    <label for="anledning">Anledning för bokning:</label><br>
                    <textarea id="anledning" name="anledning" maxlength="200"></textarea><br>
                    <span class="counter">0 / 200</span><br><br>

                    <label for="personer">Antalet personer:</label><br>
                    <input type="number" id="personer" name="personer" min="1"><br><br>
                </fieldset> 

                <input type="checkbox" id="villkor" name="villkor" required>
                <label for="villkor">Jag godkänner villkoren.</label><br><br>

                <button type="submit">Boka</button>
            </form>
        </section>
    </main><br>
    <footer>
        <p><strong>Telefonnummer:</strong> 123-456-789 -- <strong>E-post:</strong> exempel@gmail.com -- <strong>Adress:</strong> Gata 1, 123 45 Stockholm</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
